<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Noctua branding proposal v4-hell: original envelope drawing, full-bleed (iOS applies its own mask). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCB74"/>
      <stop offset="1" stop-color="#F68A3E"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F4F7"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F8FA"/>
    </linearGradient>
    <clipPath id="envClip">
      <rect x="182" y="292" width="660" height="456" rx="52"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="18" result="blur"/>
      <feFlood flood-color="#7A2E00" flood-opacity="0.22"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="flapShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="8" result="blur"/>
      <feFlood flood-color="#2B3240" flood-opacity="0.16"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="182" y="292" width="660" height="456" rx="52" fill="url(#paper)" filter="url(#shadow)"/>
  <g clip-path="url(#envClip)">
    
    <path d="M 210.6 314.1312 L 466 511.76436363636367 Q 512 555.36 558 511.76436363636367 L 813.4 314.1312" fill="none" stroke="#F5B98C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
  </g>
  <rect x="187" y="297" width="650" height="446" rx="47" fill="none" stroke="#F3A36B" stroke-width="10"/>
</svg>
