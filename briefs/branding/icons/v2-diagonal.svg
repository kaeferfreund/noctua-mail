<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Noctua branding proposal v2-diagonal: original envelope drawing, full-bleed (iOS applies its own mask). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC25E"/>
      <stop offset="1" stop-color="#EF6528"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F4F7"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F8FA"/>
    </linearGradient>
    <clipPath id="envClip">
      <rect x="162" y="300" width="700" height="440" rx="48"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="18" result="blur"/>
      <feFlood flood-color="#7A2E00" flood-opacity="0.26"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="flapShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="8" result="blur"/>
      <feFlood flood-color="#2B3240" flood-opacity="0.16"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="162" y="300" width="700" height="440" rx="48" fill="url(#paper)" filter="url(#shadow)"/>
  <g clip-path="url(#envClip)">
    <path d="M 188.4 718.88 L 392 577.6 M 835.6 718.88 L 632 577.6" fill="none" stroke="#D7D9E0" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <path d="M 188.4 317.9218285714286 L 466 506.37257142857146 Q 512 545.6 558 506.37257142857146 L 835.6 317.9218285714286" fill="none" stroke="#D7D9E0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
  </g>
  
</svg>
