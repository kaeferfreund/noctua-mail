# Install in nginx's http context. Certificates are renewed with mailprovider DNS-01.
# Query strings, authentication capabilities and request bodies never enter access logs.
log_format noctua_safe '$remote_addr $request_method $uri $status';
server {
    listen 203.0.113.10:443 ssl;
    server_name mail.example.org;
    ssl_certificate /etc/noctua/tls/fullchain.pem;
    ssl_certificate_key /etc/noctua/tls/privkey.pem;
    access_log /var/log/nginx/noctua.access.log noctua_safe;
    add_header Referrer-Policy no-referrer always;
    # nginx errors can contain full request targets. Suppress request diagnostics here.
    error_log /dev/null;

    location ~ ^/(api/(ba|auth|admin)(/|$)|reset-password(/|$)) {
        access_log off;
        proxy_pass http://127.0.0.1:3654;
        proxy_set_header Host mail.example.org;
        proxy_set_header X-Forwarded-Host mail.example.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:3654;
        proxy_set_header Host mail.example.org;
        proxy_set_header X-Forwarded-Host mail.example.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
