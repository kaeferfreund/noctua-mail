<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 1800 1800" width="1600" height="1600">
  <!-- App icon: white envelope on the iris gradient. Source of every
       raster icon (build-scripts/generate_icons.sh) and of the sidebar logo
       (app/icons/logo.svg). Keep the viewBox and the 1600 px rounded
       background: the logo's environment ribbon and the icon script rely on
       them. The envelope is drawn on a 1024 grid, enlarged by 1.085 around
       the tile centre (about 70 % x 48 % of the tile, like the iOS Mail
       icon) and scaled to 1600. -->
  <defs>
    <!-- Iris background lit like the iOS 26 Mail icon: a vertical base
         gradient around the app's primary colour (iris-9 #5b5bd6), a soft
         lightened-iris glow around the upper centre and slightly darker
         bottom corners. -->
    <linearGradient id="irisLinearGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B8DF2" />
      <stop offset="55%" style="stop-color:#6563D6" />
      <stop offset="100%" style="stop-color:#3F3BAE" />
    </linearGradient>
    <radialGradient id="irisTopGlow" cx="50%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#DCDDFF" stop-opacity="0.55" />
      <stop offset="25%" stop-color="#DCDDFF" stop-opacity="0.36" />
      <stop offset="50%" stop-color="#DCDDFF" stop-opacity="0.14" />
      <stop offset="75%" stop-color="#DCDDFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#DCDDFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="irisCornerShade" cx="50%" cy="30%" r="85%">
      <stop offset="55%" stop-color="#211C78" stop-opacity="0" />
      <stop offset="80%" stop-color="#211C78" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#211C78" stop-opacity="0.32" />
    </radialGradient>
    <linearGradient id="envelopePaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#F3F4F7" />
    </linearGradient>
    <filter id="envelopeShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" />
      <feOffset dy="18" result="blur" />
      <feFlood flood-color="#1E1B5C" flood-opacity="0.28" />
      <feComposite in2="blur" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="envelopeClip">
      <rect x="182" y="292" width="660" height="456" rx="52" />
    </clipPath>
    <!-- Flap line without a stroke color, painted grey on the envelope and
         cut out of the white monochrome badge through #envelopeFlapCut. -->
    <path id="envelopeFlap" fill="none" stroke-linecap="round" stroke-linejoin="round"
      d="M 210.6 314.1312 L 466 511.7644 Q 512 555.36 558 511.7644 L 813.4 314.1312" />
    <mask id="envelopeFlapCut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#ffffff" />
      <use href="#envelopeFlap" stroke="#000000" stroke-width="44" />
    </mask>
  </defs>
  <rect id="iconBackground" x="0" y="0" width="1600" height="1600" rx="350" ry="350" fill="url(#irisLinearGradient)" />
  <g id="iconBackgroundLight">
    <rect x="0" y="0" width="1600" height="1600" rx="350" ry="350" fill="url(#irisCornerShade)" />
    <rect x="0" y="0" width="1600" height="1600" rx="350" ry="350" fill="url(#irisTopGlow)" />
  </g>
  <g transform="scale(1.5625) translate(512 512) scale(1.085) translate(-512 -512)">
    <rect id="envelope" x="182" y="292" width="660" height="456" rx="52" fill="url(#envelopePaper)" filter="url(#envelopeShadow)" />
    <g id="envelopeFlapLine" clip-path="url(#envelopeClip)">
      <use href="#envelopeFlap" stroke="#C3C7D1" stroke-width="22" />
    </g>
  </g>
</svg>
