version: 2
updates:
  # Bun has native Dependabot support for the text-based bun.lock.
  - package-ecosystem: bun
    directory: "/"
    target-branch: integration/stage
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Major updates remain individual PRs.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: integration/stage
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
